<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shadow">
<title>Shadow Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0f0f13;
    --surface: #1a1a22;
    --surface2: #22222e;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f5;
    --muted: #888899;
    --accent: #7c6af7;
    --accent2: #a594ff;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --radius: 16px;
    --font: 'Helvetica Neue', -apple-system, sans-serif;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: -webkit-fill-available; }

  header {
    padding: env(safe-area-inset-top, 44px) 20px 16px;
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg);
  }
  .app-title { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent2); }
  .set-badge { font-size: 12px; color: var(--muted); background: var(--surface); padding: 4px 10px; border-radius: 20px; }

  .progress-wrap { padding: 0 20px 20px; }
  .progress-track { height: 2px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }
  .progress-label { font-size: 11px; color: var(--muted); margin-top: 6px; text-align: right; }

  main { flex: 1; padding: 0 20px; overflow-y: auto; }

  .phrase-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 16px;
  }
  .cat-tag {
    display: inline-block;
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent2); background: rgba(124,106,247,0.15);
    padding: 3px 8px; border-radius: 6px; margin-bottom: 14px;
  }
  .jp { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  .en { font-size: 22px; font-weight: 500; line-height: 1.4; color: var(--text); letter-spacing: -0.01em; }

  .status-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex; align-items: flex-start; gap: 12px; min-height: 56px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; background: var(--muted); transition: background 0.3s; }
  .dot.speaking { background: var(--accent); animation: blink 1s infinite; }
  .dot.recording { background: var(--red); animation: blink 0.6s infinite; }
  .dot.done { background: var(--green); animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-msg { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .spoken { font-size: 11px; color: rgba(124,106,247,0.7); margin-top: 4px; font-style: italic; }

  .btn-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .btn-full { grid-column: span 3; }
  .btn-half-span { grid-column: span 3; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  button {
    font-family: var(--font); font-size: 13px; font-weight: 500;
    padding: 13px 8px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 4px;
    -webkit-appearance: none; white-space: nowrap;
  }
  button:active { transform: scale(0.97); opacity: 0.85; }
  button:disabled { opacity: 0.3; }
  button.accent { background: var(--accent); color: #fff; border-color: transparent; }
  button.stop-btn { background: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.3); color: var(--red); }

  .feedback {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .score-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .score-num { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; }
  .score-sub { font-size: 13px; color: var(--muted); }
  .score-breakdown { font-size: 11px; color: var(--muted); margin-bottom: 14px; display: flex; gap: 12px; flex-wrap: wrap; }
  .score-breakdown span { background: var(--surface2); padding: 2px 8px; border-radius: 6px; }
  .fb-text { font-size: 13px; color: var(--muted); line-height: 1.8; white-space: pre-wrap; }

  .nav-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; }
  .nav-btn { flex: 1; padding: 12px; font-size: 13px; }
  .nav-mid { font-size: 13px; color: var(--muted); white-space: nowrap; }

  .complete-view { text-align: center; padding: 60px 20px; }
  .complete-view h2 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
  .complete-view p { font-size: 15px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; white-space: pre-wrap; }
  .complete-view button { width: 100%; padding: 16px; font-size: 16px; }

  footer { height: env(safe-area-inset-bottom, 20px); }
</style>
</head>
<body>

<header>
  <div class="app-title">Shadow Trainer</div>
  <div class="set-badge" id="set-badge">Set 1</div>
</header>

<div class="progress-wrap">
  <div class="progress-track"><div class="progress-fill" id="progress" style="width:10%"></div></div>
  <div class="progress-label" id="prog-label">1 / 10</div>
</div>

<main>
  <div id="main-view">
    <div class="phrase-card">
      <div class="cat-tag" id="cat"></div>
      <div class="jp" id="jp"></div>
      <div class="en" id="en"></div>
    </div>

    <div class="status-box">
      <div class="dot" id="dot"></div>
      <div style="flex:1">
        <div class="status-msg" id="status-msg">「まず聴く」で英文を確認してください</div>
        <div class="spoken" id="spoken"></div>
      </div>
    </div>

    <div class="btn-grid" style="margin-bottom:8px">
      <button class="accent btn-full" id="btn-listen" onclick="doListen()">📢 まず聴く</button>
    </div>
    <div class="btn-grid" style="margin-bottom:8px">
      <button id="btn-play" onclick="doShadow(1.0)" disabled>▶ 等速</button>
      <button id="btn-07" onclick="doShadow(0.7)" disabled>🐇 0.7倍</button>
      <button id="btn-half" onclick="doShadow(0.5)" disabled>🐢 0.5倍</button>
    </div>
    <div class="btn-grid" style="margin-bottom:16px">
      <button class="stop-btn btn-full" id="btn-stop" onclick="doStop()" disabled>⏹ 停止・判定</button>
    </div>

    <div id="feedback-area"></div>

    <div class="nav-row">
      <button class="nav-btn" onclick="goNav(-1)">← 前へ</button>
      <div class="nav-mid" id="nav-mid">1 / 10</div>
      <button class="nav-btn" onclick="goNav(1)">次へ →</button>
    </div>
  </div>

  <div id="complete-view" class="complete-view" style="display:none">
    <h2>🎉 セット完了！</h2>
    <p id="complete-msg"></p>
    <button class="accent" onclick="startNewSet()">次のセットへ →</button>
  </div>
</main>

<footer></footer>

const SET_SIZE = 10;
let currentSet = [], idx = 0, setNum = 1, scores = [];
let synth = window.speechSynthesis;
let recognition = null, spokenBuf = '';

function shuffle(a) {
  let arr = [...a];
  for (let i = arr.length-1; i > 0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function startNewSet() {
  currentSet = shuffle(PHRASES).slice(0, SET_SIZE);
  idx = 0; scores = [];
  document.getElementById('complete-view').style.display = 'none';
  document.getElementById('main-view').style.display = 'block';
  render();
}

function render() {
  const p = currentSet[idx];
  document.getElementById('cat').textContent = p.cat;
  document.getElementById('jp').textContent = p.jp;
  document.getElementById('en').textContent = p.en;
  document.getElementById('set-badge').textContent = 'Set ' + setNum;
  document.getElementById('progress').style.width = ((idx+1)/SET_SIZE*100) + '%';
  document.getElementById('prog-label').textContent = (idx+1) + ' / ' + SET_SIZE;
  document.getElementById('nav-mid').textContent = (idx+1) + ' / ' + SET_SIZE;
  document.getElementById('feedback-area').innerHTML = '';
  document.getElementById('spoken').textContent = '';
  setStatus('idle', '「まず聴く」で英文を確認してください');
  setDisabled(false, false, false, false, true);
}

function setStatus(type, msg) {
  const dot = document.getElementById('dot');
  dot.className = 'dot ' + type;
  document.getElementById('status-msg').textContent = msg;
}

function setDisabled(listen, play, s07, half, stop) {
  document.getElementById('btn-listen').disabled = listen;
  document.getElementById('btn-play').disabled = play;
  document.getElementById('btn-07').disabled = s07;
  document.getElementById('btn-half').disabled = half;
  document.getElementById('btn-stop').disabled = stop;
}

function speak(text, rate, onEnd) {
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate;
  u.onend = onEnd || null;
  u.onerror = onEnd || null;
  synth.speak(u);
}

function doListen() {
  if (recognition) { recognition.stop(); recognition = null; }
  setStatus('speaking', '音声再生中... 聞いてください');
  setDisabled(true, true, true, true, true);
  speak(currentSet[idx].en, 1.0, () => {
    setStatus('idle', '確認できました。再生ボタンでシャドウイング開始');
    setDisabled(false, false, false, false, true);
  });
}

function doShadow(rate) {
  if (recognition) { recognition.stop(); recognition = null; }
  spokenBuf = '';
  document.getElementById('spoken').textContent = '';
  setStatus('speaking', '再生まで0.5秒... 準備してください');
  setDisabled(true, true, true, true, false);

  // 0.5秒遅延してから再生開始
  setTimeout(() => {
    setStatus('speaking', '音声再生中... 後に続いて発音してください');
    tryStartRecognition();
    speak(currentSet[idx].en, rate, () => {
      setStatus('recording', '録音中... 話し終わったら「停止・判定」を押してください');
    });
  }, 500);
}

function tryStartRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    document.getElementById('spoken').textContent = '※ 音声認識非対応 — 自己採点モード';
    return;
  }
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = (e) => {
    let final = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript + ' ';
    }
    spokenBuf = final.trim();
    if (spokenBuf) document.getElementById('spoken').textContent = '認識: ' + spokenBuf;
  };
  recognition.onerror = (e) => {
    document.getElementById('spoken').textContent = '※ マイク: ' + e.error;
  };
  recognition.start();
}

function doStop() {
  synth.cancel();
  if (recognition) { recognition.stop(); recognition = null; }
  setDisabled(true, true, true, true, true);
  setStatus('done', 'AIが採点中...');
  setTimeout(() => evaluate(currentSet[idx].en, spokenBuf), 500);
}

// 語順・カバー率を重視した採点
function calcScore(original, spoken) {
  if (!spoken) return { total: 0, coverage: 0, order: 0 };
  const norm = t => t.toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(Boolean);
  const orig = norm(original);
  const sp = norm(spoken);
  if (orig.length === 0) return { total: 0, coverage: 0, order: 0 };

  // カバー率：元の文の単語が何個含まれているか
  const pool = [...sp]; let hits = 0;
  for (const w of orig) {
    const i = pool.indexOf(w);
    if (i !== -1) { hits++; pool.splice(i, 1); }
  }
  const coverage = Math.round(hits / orig.length * 100);

  // 語順スコア：共通単語が正しい順序で並んでいるか（最長共通部分列）
  const lcs = calcLCS(orig, sp);
  const order = orig.length > 0 ? Math.round(lcs / orig.length * 100) : 0;

  // 総合スコア：カバー率40% + 語順60%
  const total = Math.round(coverage * 0.4 + order * 0.6);
  return { total, coverage, order };
}

function calcLCS(a, b) {
  const m = a.length, n = b.length;
  const dp = Array(m+1).fill(null).map(() => Array(n+1).fill(0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  return dp[m][n];
}

async function evaluate(original, spoken) {
  const { total, coverage, order } = calcScore(original, spoken);
  let feedback = '';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        messages: [{
          role: 'user',
          content: `ビジネス英語シャドウイングの採点をしてください。スピードは評価しません。

【元の文】${original}
【認識された発話】${spoken || '（認識なし）'}
【カバー率】${coverage}%（元の文の単語をどれだけ言えたか）
【語順スコア】${order}%（正しい語順で言えたか）

以下の形式で日本語でフィードバックしてください（合計180字以内）：
総評: （語順・発音・アクセントを総合して1文）
良い点: （具体的に）
改善点: （語順のミスや発音・アクセントの問題を具体的に指摘）
ヒント: （次回への実践的アドバイス1文）`
        }]
      })
    });
    const data = await res.json();
    feedback = data.content?.find(b => b.type==='text')?.text || 'フィードバック取得失敗';
  } catch(e) {
    feedback = total > 0
      ? `カバー率${coverage}%、語順${order}%でした。引き続き練習しましょう！`
      : '音声認識なしのため自己評価してください。';
  }
  scores.push(total);
  showFeedback(total, coverage, order, feedback);
  setStatus('done', '採点完了');
  setDisabled(false, false, false, false, true);
}

function showFeedback(total, coverage, order, feedback) {
  const color = total >= 80 ? 'var(--green)' : total >= 55 ? 'var(--amber)' : 'var(--red)';
  const label = total >= 90 ? '素晴らしい！' : total >= 75 ? 'よくできました' : total >= 55 ? 'もう少し！' : total === 0 ? '自己評価で' : 'もう一度挑戦';
  document.getElementById('feedback-area').innerHTML = `
    <div class="feedback">
      <div class="score-row">
        <div class="score-num" style="color:${color}">${total > 0 ? total+'%' : '—'}</div>
        <div class="score-sub">${label}</div>
      </div>
      ${total > 0 ? `<div class="score-breakdown">
        <span>カバー率 ${coverage}%</span>
        <span>語順 ${order}%</span>
      </div>` : ''}
      <div class="fb-text">${feedback}</div>
    </div>`;
}

function goNav(dir) {
  synth.cancel();
  if (recognition) { recognition.stop(); recognition = null; }
  const next = idx + dir;
  if (next < 0 || next >= SET_SIZE) return;
  idx = next;
  render();
  if (idx === SET_SIZE - 1 && scores.length >= SET_SIZE) {
    setTimeout(showComplete, 300);
  }
}

function showComplete() {
  const avg = scores.length ? Math.round(scores.reduce((a,b)=>a+b,0)/scores.length) : 0;
  document.getElementById('main-view').style.display = 'none';
  document.getElementById('complete-view').style.display = 'block';
  const msg = avg >= 80 ? '素晴らしいセットでした！この調子で続けましょう 🌟' :
              avg >= 60 ? 'いい練習になりました！次のセットも頑張りましょう 💪' :
              'まだまだ伸びしろがあります。繰り返し練習が大切です 🔄';
  document.getElementById('complete-msg').textContent = avg > 0 ? `平均スコア: ${avg}%\n${msg}` : msg;
  setNum++;
}

startNewSet();
</script>
</body>
</html>
